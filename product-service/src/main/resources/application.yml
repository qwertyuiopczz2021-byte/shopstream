server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-product:3306/products?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shoppw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
