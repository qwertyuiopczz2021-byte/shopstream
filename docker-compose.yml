name: shopstream

# From Step 5 on, exactly one container publishes a port: the gateway on 8080.
# Every other service is reachable only inside this network, by its compose name
# or through Eureka. For debugging there is docker-compose.dev.yml, which
# publishes the registry and the broker on the host without changing this file.

services:

  # ---------------------------------------------------------------------------
  # infrastructure
  # ---------------------------------------------------------------------------

  mysql-product:
    image: mysql:8.4
    container_name: shopstream-mysql-product
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PRODUCT_DB_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-order:
    image: mysql:8.4
    container_name: shopstream-mysql-order
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ORDER_DB_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Single Kafka broker in KRaft mode: no ZooKeeper container, the broker
  # elects itself as controller.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopstream-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics are created by the services themselves, with the partition count we chose
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One Elasticsearch node, used only by search-service. Security is switched
  # off because the node is not reachable from outside the compose network, and
  # the heap is capped so the JVM does not try to take all the machine memory.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: shopstream-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Carts and the product cache live here. The password is required because
  # Redis has no authentication of its own otherwise, and the container is on
  # the same network as every other service.
  redis:
    image: redis:7.2-alpine
    container_name: shopstream-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # AOF on a named volume: a cart survives a restart and then disappears on
      # its own when the TTL runs out, which is the behaviour a cart needs.
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Spring Cloud infrastructure
  # ---------------------------------------------------------------------------

  discovery-server:
    build: ./discovery-server
    image: shopstream/discovery-server:1.0
    container_name: shopstream-discovery-server
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  # Serves config-repo/*.yml over HTTP. The folder is mounted instead of copied
  # into the image, so changing a property needs a restart of the client service
  # and nothing else.
  config-server:
    build: ./config-server
    image: shopstream/config-server:1.0
    container_name: shopstream-config-server
    environment:
      SERVER_PORT: 8888
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  # ---------------------------------------------------------------------------
  # business services - no published ports, all found through Eureka
  # ---------------------------------------------------------------------------

  # Two instances of the same image: the gateway load-balances between them, and
  # the Eureka dashboard shows them as two entries of product-service.
  product-service:
    <<: &product-service
      build: ./product-service
      image: shopstream/product-service:1.0
      environment:
        DB_URL: jdbc:mysql://mysql-product:3306/${PRODUCT_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        DB_USER: ${MYSQL_USER}
        DB_PASSWORD: ${MYSQL_PASSWORD}
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        REDIS_HOST: redis
        REDIS_PORT: 6379
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        SERVER_PORT: 8080
      depends_on:
        mysql-product:
          condition: service_healthy
        kafka:
          condition: service_healthy
        redis:
          condition: service_healthy
        config-server:
          condition: service_healthy
    container_name: shopstream-product-service-1

  product-service-2:
    <<: *product-service
    container_name: shopstream-product-service-2

  order-service:
    build: ./order-service
    image: shopstream/order-service:1.0
    container_name: shopstream-order-service
    environment:
      DB_URL: jdbc:mysql://mysql-order:3306/${ORDER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
    depends_on:
      mysql-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    image: shopstream/notification-service:1.0
    container_name: shopstream-notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy

  search-service:
    build: ./search-service
    image: shopstream/search-service:1.0
    container_name: shopstream-search-service
    environment:
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # The cart API. It owns no database: a cart is a Redis hash with a TTL, and
  # checkout calls order-service through a Feign client resolved by Eureka.
  cart-service:
    build: ./cart-service
    image: shopstream/cart-service:1.0
    container_name: shopstream-cart-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CHECKOUT_TIMEOUT_MS: 5000
      SERVER_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      order-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # edge
  # ---------------------------------------------------------------------------

  # The storefront is only static files now: the nginx container no longer
  # proxies /api/*, because the gateway does that and both are behind it.
  frontend:
    build: ./frontend
    image: shopstream/frontend:1.0
    container_name: shopstream-frontend

  # The only published port in the system. Routes come from config-server
  # (config-repo/api-gateway.yml), and every API route is an lb:// URI, so the
  # gateway asks Eureka where the service is instead of dialling an address.
  api-gateway:
    build: ./api-gateway
    image: shopstream/api-gateway:1.0
    container_name: shopstream-api-gateway
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      product-service:
        condition: service_started
      product-service-2:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      search-service:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  redis-data:
  product-db-data:
  order-db-data:
  kafka-data:
  es-data:
