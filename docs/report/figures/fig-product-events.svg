<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="420" viewBox="0 0 1360 420"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e37400"/></marker></defs><text x="680" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#202124" text-anchor="middle">Keeping the search index in sync with the catalogue</text><rect x="120" y="130" width="250" height="84" rx="10" fill="#e8f0fe" stroke="#5f6368" stroke-width="1.6"/><text x="245.0" y="166.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">product-service</text><text x="245.0" y="190.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">writes the products table</text><rect x="500" y="130" width="250" height="84" rx="10" fill="#fff3e0" stroke="#e37400" stroke-width="1.6"/><text x="625.0" y="166.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">product-events</text><text x="625.0" y="190.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">key = productId</text><rect x="900" y="130" width="250" height="84" rx="10" fill="#e6f4ea" stroke="#5f6368" stroke-width="1.6"/><text x="1025.0" y="166.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">search-service</text><text x="1025.0" y="190.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">products index</text><line x1="370" y1="172" x2="500" y2="172" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><text x="435" y="158" font-family="Consolas, monospace" font-size="12" font-weight="normal" fill="#e37400" text-anchor="middle">after commit</text><line x1="750" y1="172" x2="900" y2="172" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><text x="825" y="158" font-family="Consolas, monospace" font-size="12" font-weight="normal" fill="#e37400" text-anchor="middle">consume</text><text x="680" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6368" text-anchor="middle">ProductCreated / ProductUpdated / ProductDeleted are published by an AFTER_COMMIT listener,</text><text x="680" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6368" text-anchor="middle">so the index never learns about a write that was rolled back. The same events refresh the stock field.</text></svg>