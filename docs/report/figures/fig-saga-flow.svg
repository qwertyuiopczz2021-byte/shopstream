<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e37400"/></marker></defs><text x="700" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#202124" text-anchor="middle">The order saga: an order is accepted first, confirmed or rejected by events afterwards</text><rect x="60" y="100" width="230" height="80" rx="10" fill="#e8f0fe" stroke="#5f6368" stroke-width="1.6"/><text x="175.0" y="134.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">order-service</text><text x="175.0" y="158.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">POST /orders</text><rect x="390" y="100" width="230" height="80" rx="10" fill="#fff3e0" stroke="#e37400" stroke-width="1.6"/><text x="505.0" y="134.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">order-events</text><text x="505.0" y="158.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">key = orderId</text><rect x="720" y="100" width="230" height="80" rx="10" fill="#e8f0fe" stroke="#5f6368" stroke-width="1.6"/><text x="835.0" y="134.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">product-service</text><text x="835.0" y="158.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">groupId product-service</text><rect x="1050" y="100" width="230" height="80" rx="10" fill="#fff3e0" stroke="#e37400" stroke-width="1.6"/><text x="1165.0" y="134.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">inventory-events</text><text x="1165.0" y="158.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">key = orderId</text><line x1="290" y1="140" x2="390" y2="140" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><text x="340" y="126" font-family="Consolas, monospace" font-size="12" font-weight="normal" fill="#e37400" text-anchor="middle">OrderPlaced</text><line x1="620" y1="140" x2="720" y2="140" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><text x="670" y="126" font-family="Consolas, monospace" font-size="12" font-weight="normal" fill="#e37400" text-anchor="middle">consume</text><text x="670" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124" text-anchor="middle"></text><line x1="950" y1="140" x2="1050" y2="140" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1000" y="126" font-family="Consolas, monospace" font-size="12" font-weight="normal" fill="#e37400" text-anchor="middle">produce</text><rect x="390" y="420" width="230" height="80" rx="10" fill="#e8f0fe" stroke="#5f6368" stroke-width="1.6"/><text x="505.0" y="454.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">order-service</text><text x="505.0" y="478.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">status = CONFIRMED / REJECTED</text><rect x="1050" y="420" width="230" height="80" rx="10" fill="#e6f4ea" stroke="#5f6368" stroke-width="1.6"/><text x="1165.0" y="454.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">notification-service</text><text x="1165.0" y="478.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">one email per order</text><polyline points="1165,180 1165,320 505,320 505,420" fill="none" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="1165" y1="320" x2="1165" y2="420" stroke="#e37400" stroke-width="1.8" marker-end="url(#arrow)"/><text x="660" y="308" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#e37400" text-anchor="middle">StockReserved / StockRejected</text><text x="660" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5f6368" text-anchor="middle">consumed by both order-service and notification-service, in two different consumer groups</text><text x="700" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6368" text-anchor="middle">order-service and notification-service each have their own consumer group, so both of them see every inventory event.</text><text x="700" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6368" text-anchor="middle">The screenshot of the two services' logs shows both of them handling order 14 — one updates the order, the other one writes the email.</text></svg>