ight="normal" fill="#5f6368" text-anchor="middle">products DB</text><line x1="185" y1="398" x2="185" y2="580" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="400" y="580" width="210" height="72" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.6"/><text x="505.0" y="610.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">mysql-order</text><text x="505.0" y="634.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">orders DB</text><line x1="505" y1="398" x2="505" y2="580" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="730" y="580" width="210" height="72" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.6"/><text x="835.0" y="610.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">redis</text><text x="835.0" y="634.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">carts:{userId}</text><line x1="835" y1="398" x2="835" y2="580" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1060" y="580" width="210" height="72" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.6"/><text x="1165.0" y="610.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">elasticsearch</text><text x="1165.0" y="634.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">products index</text><line x1="1165" y1="398" x2="1165" y2="580" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/></svg>