0" stroke-width="1.6" marker-end="url(#arrow)"/><text x="760" y="250" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#e37400" text-anchor="middle">ProductCreated / Updated / Deleted</text><text x="680" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">Orange boxes are topics. The message key is the order id (or product id), so all events about one aggregate land in the same partition and stay ordered.</text></svg>