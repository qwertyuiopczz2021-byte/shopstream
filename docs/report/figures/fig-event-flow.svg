vents</text><text x="170.0" y="613.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">key = orderId</text><rect x="660" y="560" width="220" height="64" rx="10" fill="#e8f0fe" stroke="#5f6368" stroke-width="1.6"/><text x="770.0" y="588.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">order-service</text><text x="770.0" y="610.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">updates the order</text><rect x="1060" y="560" width="240" height="70" rx="10" fill="#e6f4ea" stroke="#5f6368" stroke-width="1.6"/><text x="1180.0" y="591.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">notification-service</text><text x="1180.0" y="613.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">one email per order</text><rect x="1060" y="300" width="240" height="70" rx="10" fill="#e6f4ea" stroke="#5f6368" stroke-width="1.6"/><text x="1180.0" y="331.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">search-service</text><text x="1180.0" y="353.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">products index</text><rect x="1060" y="90" width="240" height="70" rx="10" fill="#fff3e0" stroke="#e37400" stroke-width="1.6"/><text x="1180.0" y="121.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle">product-events</text><text x="1180.0" y="143.0" font-family="Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5f6368" text-anchor="middle">key = productId</text><line x1="700" y1="154" x2="700" y2="190" stroke="#e37400" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 660 200 C 300 200, 17