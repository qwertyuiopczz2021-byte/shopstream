server:
  port: 8761

spring:
  application:
    name: discovery-server

# This is the registry itself, so it neither registers nor fetches a registry.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # While developing, a service that stops is gone for good; without this the
    # dashboard keeps offering its stale entry for a while.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
