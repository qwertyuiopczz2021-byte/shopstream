server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page is still the same single origin as before, but this container is
    # no longer the front door: since Step 5 the gateway publishes 8080 and
    # forwards /api/products, /api/orders, /api/carts and /api/search to the
    # services, so nginx here only serves the static files. Keeping a second
    # proxy in front of the gateway would hide the routing the project is about.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
