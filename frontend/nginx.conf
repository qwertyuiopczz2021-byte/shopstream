server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/<service>/... is forwarded to the service that owns it. The location
    # has no trailing slash on purpose: a location ending in "/" makes nginx
    # answer /api/products itself with a 301 to /api/products/, which Spring
    # no longer maps (Boot 3 dropped trailing-slash matching).
    # Every path here is one api-gateway will take over in Step 5, which is why
    # the page itself will not change when the gateway replaces this proxy.

    location /api/products {
        proxy_pass http://product-service:8080/products;
        proxy_set_header Host $host;
    }

    location /api/orders {
        proxy_pass http://order-service:8080/orders;
        proxy_set_header Host $host;
    }

    location /api/carts {
        proxy_pass http://cart-service:8080/carts;
        proxy_set_header Host $host;
        # checkout waits for the order to settle, which can take seconds
        proxy_read_timeout 30s;
    }

    location /api/search {
        proxy_pass http://search-service:8080/search;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
