<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopStream — storefront</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>ShopStream<span class="tag" data-i18n="brand_tag"></span></div>

  <nav class="tabs">
    <button class="tab active" data-view="store" data-i18n="nav_store"></button>
    <button class="tab" data-view="cart"><span data-i18n="nav_cart"></span><span id="cart-count" class="pill">0</span></button>
    <button class="tab" data-view="orders" data-i18n="nav_orders"></button>
  </nav>

  <label class="user"><span data-i18n="signed_in"></span><input id="user-id" value="guest" autocomplete="off" spellcheck="false"></label>
  <button id="lang" class="lang" title="language">中文</button>
</header>

<main>

  <section id="view-store" class="view">
    <div class="toolbar">
      <input id="q" class="grow" data-i18n-ph="search_ph" autocomplete="off">
      <select id="category"></select>
      <input id="min-price" class="price" type="number" min="0" step="1" data-i18n-ph="min_ph">
      <input id="max-price" class="price" type="number" min="0" step="1" data-i18n-ph="max_ph">
      <button id="search" class="primary" data-i18n="btn_search"></button>
      <button id="reset" class="ghost" data-i18n="btn_reset"></button>
    </div>

    <p id="result-line" class="muted" data-i18n="loading"></p>
    <div id="grid" class="grid"></div>
  </section>

  <section id="view-cart" class="view hidden">
    <h2 data-i18n="cart_title"></h2>
    <p id="cart-note" class="muted"></p>

    <div id="cart-banner" class="banner hidden"></div>
    <div id="cart-empty" class="empty hidden" data-i18n="cart_empty"></div>

    <div id="cart-table" class="cart-table">
      <div class="cart-head">
        <span data-i18n="col_item"></span><span data-i18n="col_price"></span><span data-i18n="col_qty"></span><span data-i18n="col_total"></span><span></span>
      </div>
      <div id="cart-rows"></div>
      <div class="cart-foot">
        <button id="clear-cart" class="ghost danger" data-i18n="btn_clear"></button>
        <div class="sum"><span data-i18n="total"></span><strong id="cart-total">€0.00</strong></div>
        <button id="checkout" class="primary big" data-i18n="btn_checkout"></button>
      </div>
    </div>
  </section>

  <section id="view-orders" class="view hidden">
    <h2 data-i18n="orders_title"></h2>
    <p id="orders-note" class="muted"></p>

    <div class="toolbar">
      <input id="order-id" class="price" type="number" min="1" data-i18n-ph="order_id_ph">
      <button id="track" class="primary" data-i18n="btn_track"></button>
    </div>

    <div id="order-card"></div>

    <h3 class="recent-title" data-i18n="recent_title"></h3>
    <div id="recent" class="recent"></div>
  </section>

</main>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
