server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-order:3306/orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shoppw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: hu.unimiskolc.shopstream.events
    admin:
      fail-fast: false

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
