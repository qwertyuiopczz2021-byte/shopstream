server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: search-service
  # Everything else - database, Kafka, Redis, Elasticsearch and the Kafka topic
  # names - is served by config-server from the config-repo folder. "optional:"
  # means the service still starts when the config server is unreachable instead
  # of failing on startup; in this stack it is always there, because compose
  # starts it before the services and gives it a health check.
  config:
    import: "optional:configserver:http://config-server:8888"

management:
  endpoints:
    web:
      exposure:
        include: health,info
